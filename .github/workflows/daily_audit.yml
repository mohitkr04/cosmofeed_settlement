name: Cosmofeed Daily Payout Audit

on:
  push:
    branches: [ main ]
  schedule:
    # -------------------------------------------------------------
    # 1. MORNING CADENCE (Runs automatically before 08:00 AM IST)
    # Note: GitHub Actions cron uses UTC (IST = UTC + 5:30)
    # - 05:30 AM IST (00:00 UTC) - Initial morning batch
    # - 06:30 AM IST (01:00 UTC) - Secondary morning audit sweep
    # - 07:00 AM IST (01:30 UTC) - Verification sweep
    # - 07:30 AM IST (02:00 UTC) - Final pre-8 AM seal & publish
    # -------------------------------------------------------------
    - cron: '0 0 * * *'
    - cron: '0 1 * * *'
    - cron: '30 1 * * *'
    - cron: '0 2 * * *'
    # -------------------------------------------------------------
    # 2. CONTINUOUS DAYTIME UPDATES (Every 2 hours during business hours)
    # Captures newly created settlements submitted throughout the day:
    # - 09:30 AM IST (04:00 UTC)
    # - 11:30 AM IST (06:00 UTC)
    # - 01:30 PM IST (08:00 UTC)
    # - 03:30 PM IST (10:00 UTC)
    # - 05:30 PM IST (12:00 UTC)
    # - 07:30 PM IST (14:00 UTC)
    # - 09:30 PM IST (16:00 UTC)
    # -------------------------------------------------------------
    - cron: '0 4 * * *'
    - cron: '0 6 * * *'
    - cron: '0 8 * * *'
    - cron: '0 10 * * *'
    - cron: '0 12 * * *'
    - cron: '0 14 * * *'
    - cron: '0 16 * * *'
  workflow_dispatch:
    inputs:
      access_token:
        description: 'Today Access Token (Optional - overrides stored secret)'
        required: false
        type: string

concurrency:
  group: cosmofeed-audit
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  audit-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Automated Daily Payout & SEBI Audit
        env:
          COSMOFEED_TOKEN: ${{ inputs.access_token || secrets.COSMOFEED_TOKEN || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1c2VySWQiOiI2OGVmNTM3ZmZkYWNlNzlkNzQ4ZGI1MTciLCJpYXQiOjE3ODY1OTQ4NDMsImV4cCI6MjEwMTk1NDg0M30.r47i32k6PktqovRWGptLLFQ8GW1OuDxgCI-XIm3m5DI' }}
          COSMOFEED_REFRESH_TOKEN: ${{ secrets.COSMOFEED_REFRESH_TOKEN }}
        run: |
          echo "Running daily audit script in the cloud (India Standard Time)..."
          python daily_automation.py --no-push

      - name: Commit & Push Updated Reports & Non-SEBI Ledger to Git
        continue-on-error: true
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/ data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: Daily payout audit & Non-SEBI ledger update [$(date +'%Y-%m-%d')] [skip ci]" && (git pull --rebase -X theirs origin main || true) && git push origin main || true)

      - name: Setup Pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        continue-on-error: true
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        continue-on-error: true
        id: deployment
        uses: actions/deploy-pages@v4

