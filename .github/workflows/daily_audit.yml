name: Cosmofeed Daily Payout Audit

on:
  schedule:
    # Runs daily at 10:00 AM IST (04:30 AM UTC)
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      access_token:
        description: 'Today Access Token (Optional - overrides stored secret)'
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  audit-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Daily Payout Audit
        env:
          COSMOFEED_TOKEN: ${{ inputs.access_token || secrets.COSMOFEED_TOKEN }}
          COSMOFEED_REFRESH_TOKEN: ${{ secrets.COSMOFEED_REFRESH_TOKEN }}
        run: |
          echo "Running daily audit script..."
          python payout_audit_agent.py --date $(date +'%Y-%m-%d')
          python build_data_from_audit.py
          python generate_report.py

      - name: Commit & Push Updated Reports to Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: Daily payout audit update [$(date +'%Y-%m-%d')]" && git push)

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
