name: Cosmofeed Daily Payout Audit

on:
  push:
    branches: [ main ]
  schedule:
    # Runs daily at 09:00 AM IST (03:30 AM UTC), 1 hour before 10:00 AM deadline
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      access_token:
        description: 'Today Access Token (Optional - overrides stored secret)'
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  audit-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Automated Daily Payout & SEBI Audit
        env:
          COSMOFEED_TOKEN: ${{ inputs.access_token || secrets.COSMOFEED_TOKEN }}
          COSMOFEED_REFRESH_TOKEN: ${{ secrets.COSMOFEED_REFRESH_TOKEN }}
        run: |
          echo "Running daily audit script before 10:00 AM IST..."
          python daily_automation.py --no-push

      - name: Commit & Push Updated Reports & Non-SEBI Ledger to Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/ data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: Daily payout audit & Non-SEBI ledger update [$(date +'%Y-%m-%d')] [skip ci]" && git push)

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
